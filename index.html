<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stack Tower - Tap &amp; Build</title>
  <style>
    :root {
      --bg: #0f1225;
      --card-bg: #191e3b;
      --text: #e2e8f0;
      --heading: #ffffff;
      --accent: #fbbf24;
      --link: #60a5fa;
      --border: #2d3748;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      margin: 0;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 {
      color: var(--heading);
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      color: #cbd5e1;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--accent);
    }
    .btn:hover {
      background: rgba(251, 191, 36, 0.15);
    }
    .footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stack Tower - Tap &amp; Build</h1>
    <p>Official legal and support pages for the Stack Tower Android game.</p>
    <div class="links">
      <a class="btn" href="terms_and_conditions.html">Terms &amp; Conditions</a>
      <a class="btn" href="privacy_policy.html">Privacy Policy</a>
    </div>
    <div class="footer">
      Support: <a style="color: #60a5fa; text-decoration: none;" href="mailto:support@stacktower.com">support@stacktower.com</a><br>
      &copy; 2026 Stack Tower Game. All rights reserved.
    </div>
  </div>
</body>
</html>
